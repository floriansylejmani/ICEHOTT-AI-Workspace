# Local observability overlay (Phase 7C). Adds an OpenTelemetry Collector and points the API and
# AI service at it. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up --build
#
# Telemetry is auxiliary: the API and AI service intentionally do NOT depend_on the collector, so
# stopping it demonstrates that business behaviour is unaffected.
services:
  otel-collector:
    # Pinned by digest; contrib is required for the attributes processor and debug exporter set.
    image: otel/opentelemetry-collector-contrib@sha256:45392d534c1edcc809c2d112394029246bc679d2ae5ea7081414a1fc74f2c621
    command: ["--config=/etc/otelcol/collector.yaml"]
    environment:
      # Prints trace ids so cross-service correlation can be verified from the container log.
      OTEL_DEBUG_VERBOSITY: ${OTEL_DEBUG_VERBOSITY:-detailed}
    volumes:
      - ./deploy/otel/collector.yaml:/etc/otelcol/collector.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_PROMETHEUS_PORT:-8889}:8889"
      - "${OTEL_HEALTH_PORT:-13133}:13133"

  api:
    environment:
      Observability__Enabled: "true"
      Observability__Otlp__Endpoint: http://otel-collector:4317
      Observability__Otlp__Protocol: grpc
      Observability__Otlp__TimeoutSeconds: "2"
      Observability__Traces__SamplingRatio: "1"

  ai:
    environment:
      OBSERVABILITY_ENABLED: "true"
      OBSERVABILITY_OTLP_ENDPOINT: http://otel-collector:4318
      OBSERVABILITY_OTLP_PROTOCOL: http/protobuf
      OBSERVABILITY_OTLP_TIMEOUT_SECONDS: "2"
      OBSERVABILITY_TRACES_SAMPLING_RATIO: "1"
