services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-icehott}
      POSTGRES_USER: ${POSTGRES_USER:-icehott}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-icehott} -d ${POSTGRES_DB:-icehott}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai:
    build:
      context: .
      dockerfile: ai/icehott-ai-service/Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-icehott};Username=${POSTGRES_USER:-icehott};Password=${POSTGRES_PASSWORD:-change-me}
      Jwt__Key: ${JWT_SECRET_KEY:-ICEHOTT-development-only-key-never-use-in-production-2026}
      Cors__AllowedOrigins__0: http://localhost:3000
      Database__AutoMigrate: "true"
      AiRuntime__BaseUrl: http://ai:8000
      AiRuntime__TimeoutSeconds: "30"
      OpenAiEmbedding__ApiKey: ${OPENAI_API_KEY:-}
    ports:
      - "5050:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy

volumes:
  postgres_data:
